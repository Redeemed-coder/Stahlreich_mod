l_japanese:
 # --- 共産主義 ---
 communism:0 "共産主義"
 communism_noun:0 "共産主義"
 communism_desc:0 "共産主義体制"

 communism_ideology:0 "共産主義"
 communism_ideology_desc:0 "生産手段の共有と階級なき社会の実現を目指す、最も標準的な共産主義思想です。"
 communism_bolshevism_ideology:0 "ボリシェヴィズム"
 communism_bolshevism_ideology_desc:0 "前衛党による強力な指導とプロレタリアート独裁を通じて、社会主義革命を遂行する思想です。"
 communism_marxism_leninism_ideology:0 "マルクス＝レーニン主義"
 communism_marxism_leninism_ideology_desc:0 "一国社会主義論や民主集中制を柱とし、国家主導の計画経済と重工業化を推進する正統派の共産主義です。"
 communism_maoism_ideology:0 "毛沢東思想"
 communism_maoism_ideology_desc:0 "農村からの都市包囲や大衆路線、そして絶え間ない文化闘争によって革命を継続する思想です。"
 communism_bukharinism_ideology:0 "ブハーリン主義"
 communism_bukharinism_ideology_desc:0 "急激な集団化を避け、市場経済の要素や農民との協調を一定程度認める穏健・現実路線の共産主義です。"
 communism_juche_ideology:0 "主体思想"
 communism_juche_ideology_desc:0 "思想における主体、政治における自主、経済における自立、国防における自衛を掲げる独自の社会主義思想です。"
 communism_national_communism_ideology:0 "民族共産主義"
 communism_national_communism_ideology_desc:0 "国際的な教条主義を排し、自国の歴史・文化・民族的利益に根ざした独自の社会主義建設を目指す思想です。"
 communism_stratocratic_communism_ideology:0 "軍政共産主義"
 communism_stratocratic_communism_ideology_desc:0 "軍部が前衛党の役割を兼ね、厳格な軍律と戦時動員体制によって社会主義国家を維持する体制です。"
 communism_securocratic_communism_ideology:0 "防諜共産主義"
 communism_securocratic_communism_ideology_desc:0 "高度な諜報機関と監視網によって反革命分子を徹底的に排除し、国家の安全を最優先する体制です。"
 communism_primitive_communism_ideology:0 "原始共産主義"
 communism_primitive_communism_ideology_desc:0 "近代的な国家や貨幣経済、産業文明を否定し、部族的・共同体的な平等社会への回帰を目指す急進思想です。"
 communism_jacobinism_ideology:0 "ジャコバン主義"
 communism_jacobinism_ideology_desc:0 "急進的な共和主義と革命的恐怖政治の伝統を受け継ぎ、旧体制の徹底的な破壊と平等を追求する思想です。"
 communism_posadism_ideology:0 "ポサダス主義"
 communism_posadism_ideology_desc:0 "核戦争による資本主義の壊滅と、宇宙の知的生命体との連帯によって真の共産主義が到来すると説く特異な思想です。"
 SUBIDEOLOGY_TEXT_LOC:0 "[GetSubideologyName]"
 # --- 急進社会主義 ---
 radical_socialism:0 "急進社会主義"
 radical_socialism_noun:0 "急進社会主義"
 radical_socialism_desc:0 "急進社会主義体制"

 radical_socialism_ideology:0 "急進社会主義"
 radical_socialism_ideology_desc:0 "既存の資本主義や権威主義体制を根底から覆し、人民主権と平等な社会の即時実現を目指す急進的な社会主義思想です。"
 radical_socialism_social_republicanism_ideology:0 "社会共和主義"
 radical_socialism_social_republicanism_ideology_desc:0 "急進的な共和主義と社会主義的経済改革を結びつけ、市民の自由と経済的平等の両立を目指す思想です。"
 radical_socialism_trotskyism_ideology:0 "トロツキー主義"
 radical_socialism_trotskyism_ideology_desc:0 "一国社会主義と官僚主義を批判し、世界同時革命と永続革命論を掲げる国際主義的共産主義です。"
 radical_socialism_left_communism_ideology:0 "左翼共産主義"
 radical_socialism_left_communism_ideology_desc:0 "ボリシェヴィキの国家資本主義的傾向や議会主義への妥協を拒絶し、純粋な労働者評議会による統治を求める思想です。"
 radical_socialism_left_wing_nationalism_ideology:0 "左翼ナショナリズム"
 radical_socialism_left_wing_nationalism_ideology_desc:0 "反帝国主義と民族自決を掲げ、民族解放闘争と社会主義的な富の再分配を一体化させる思想です。"
 radical_socialism_pan_arabism_ideology:0 "汎アラブ主義"
 radical_socialism_pan_arabism_ideology_desc:0 "植民地主義によって分断されたアラブ世界の統一と、アラブ独自の社会主義的近代化を目指す思想です。"
 radical_socialism_pan_africanism_ideology:0 "汎アフリカ主義"
 radical_socialism_pan_africanism_ideology_desc:0 "アフリカ大陸全体の連帯と解放を掲げ、旧宗主国の支配を完全に一掃しようとする革命思想です。"
 radical_socialism_african_socialism_ideology:0 "アフリカ社会主義"
 radical_socialism_african_socialism_ideology_desc:0 "西洋型の階級闘争論ではなく、アフリカ古来の共同体精神と相互扶助を基盤とした独自の社会主義です。"
 radical_socialism_market_socialism_ideology:0 "市場社会主義"
 radical_socialism_market_socialism_ideology_desc:0 "生産手段の公有や協同組合所有を維持しつつ、資源配分や価格決定に市場メカニズムを取り入れる現実的な社会主義です。"
 radical_socialism_revolutionary_front_ideology:0 "革命戦線"
 radical_socialism_revolutionary_front_ideology_desc:0 "多様な左派勢力や反体制派が共通の敵を打倒するために結集した、統一戦線型の革命運動です。"
 radical_socialism_self_managed_socialism_ideology:0 "自主管理社会主義"
 radical_socialism_self_managed_socialism_ideology_desc:0 "国家による中央集権的な統制を排し、労働者自身が評議会を通じて工場や地域社会を直接運営する社会主義です。"
 radical_socialism_islamic_socialism_ideology:0 "イスラム社会主義"
 radical_socialism_islamic_socialism_ideology_desc:0 "イスラム教の平等主義と社会的公正の教えを、反帝国主義および社会主義的な経済政策と融合させた思想です。"
 radical_socialism_buddhist_socialism_ideology:0 "仏教社会主義"
 radical_socialism_buddhist_socialism_ideology_desc:0 "仏教の慈悲や中道の精神に基づき、物質主義的な資本主義を批判して調和ある福祉社会を目指す思想です。"
 radical_socialism_revolutionary_gaitanism_ideology:0 "革命的ガイタン主義"
 radical_socialism_revolutionary_gaitanism_ideology_desc:0 "寡頭制支配層に対する大衆の直接行動と、急進的な農地改革・社会正義の実現を掲げるポピュリズム的社会主義です。"
 radical_socialism_revolutionary_peronism_ideology:0 "革命的ペロン主義"
 radical_socialism_revolutionary_peronism_ideology_desc:0 "反帝国主義と労働者階級の解放を掲げ、民族解放闘争と社会主義革命の達成を目指すペロン主義の急進左派路線です。"
 radical_socialism_guevarism_ideology:0 "ゲバラ主義"
 radical_socialism_guevarism_ideology_desc:0 "農村部での武装ゲリラ闘争（フォコ理論）を起爆剤とし、革命家の自己犠牲によって大衆を覚醒させる武装革命思想です。"

 # --- 自由社会主義 ---
 libertarian_socialism:0 "自由社会主義"
 libertarian_socialism_noun:0 "自由社会主義"
 libertarian_socialism_desc:0 "自由社会主義体制"

 libertarian_socialism_ideology:0 "自由社会主義"
 libertarian_socialism_ideology_desc:0 "国家による中央集権的な統制を退け、個人の自由と分権的な自主管理を重視する反権威主義的な社会主義思想です。"
 libertarian_socialism_eurocommunism_ideology:0 "ユーロ・コミュニズム"
 libertarian_socialism_eurocommunism_ideology_desc:0 "プロレタリアート独裁を放棄し、議会制民主主義と複数政党制の枠組みの中で平和的に社会主義の実現を目指す思想です。"
 libertarian_socialism_anarcho_communism_ideology:0 "アナルコ・コミュニズム"
 libertarian_socialism_anarcho_communism_ideology_desc:0 "国家、資本主義、賃金労働、私有財産をすべて廃止し、自由なコミューンの連合による無政府共産社会を目指す思想です。"
 libertarian_socialism_syndicalism_ideology:0 "サンディカリスム"
 libertarian_socialism_syndicalism_ideology_desc:0 "労働組合（サンディカ）のゼネストと直接行動によって資本主義を打倒し、産業別の労働組合連合が経済を運営する思想です。"
 libertarian_socialism_christian_socialism_ideology:0 "キリスト教社会主義"
 libertarian_socialism_christian_socialism_ideology_desc:0 "初期キリスト教の隣人愛と共有の精神に基づき、平和的・道徳的な社会改革によって資本主義の害悪を乗り越えようとする思想です。"
 libertarian_socialism_datong_socialism_ideology:0 "大同社会主義"
 libertarian_socialism_datong_socialism_ideology_desc:0 "東洋の伝統的な「大同」の理想と近代社会主義を融合させ、すべての人々が調和して暮らす平和な世界共同体を目指す思想です。"
 libertarian_socialism_utopian_socialism_ideology:0 "空想的社会主義"
 libertarian_socialism_utopian_socialism_ideology_desc:0 "暴力革命ではなく、理性や博愛、協同組合や実験的共同体の建設を通じて理想の平等社会を築こうとする思想です。"
 libertarian_socialism_labor_zionism_ideology:0 "労働シオニズム"
 libertarian_socialism_labor_zionism_ideology_desc:0 "ユダヤ人の民族自決と協同組合（キブツ）を基盤とした社会主義的な国家建設を両立させる思想です。"
 libertarian_socialism_gaitanism_ideology:0 "ガイタン主義"
 libertarian_socialism_gaitanism_ideology_desc:0 "市民の政治的自由と民主主義を尊重しつつ、寡頭制を打破して社会正義と富の再分配を進める穏健左派ポピュリズムです。"
 
# --- 進歩主義 ---
 progressivism:0 "進歩主義"
 progressivism_noun:0 "進歩主義"
 progressivism_desc:0 "進歩主義体制"

 progressivism_ideology:0 "進歩主義"
 progressivism_ideology_desc:0 "民主主義の枠組みの中で積極的な社会改革と経済規制を行い、格差是正と市民権の拡大を目指す思想です。"
 progressivism_social_democracy_ideology:0 "社会民主主義"
 progressivism_social_democracy_ideology_desc:0 "資本主義経済の活力を維持しつつ、累進課税と手厚い社会保障制度によって福祉国家の建設を目指す思想です。"
 progressivism_democratic_socialism_ideology:0 "民主社会主義"
 progressivism_democratic_socialism_ideology_desc:0 "議会制民主主義と政治的自由を厳格に守りながら、基幹産業の公有化や計画経済への移行を進める思想です。"
 progressivism_social_reformism_ideology:0 "社会改良主義"
 progressivism_social_reformism_ideology_desc:0 "急激な変革を避け、法改正や労働環境の改善など段階的かつ現実的な制度改革の積み重ねによって社会を良くする思想です。"
 progressivism_social_patriotism_ideology:0 "社会愛国主義"
 progressivism_social_patriotism_ideology_desc:0 "国内の福祉充実や労働者保護と、自国の防衛や国益の擁護を結びつける愛国的な社会改革路線です。"
 progressivism_neocorporatism_ideology:0 "ネオコーポラティズム"
 progressivism_neocorporatism_ideology_desc:0 "政府・労働組合・経営者団体の三者協調によって賃金や経済政策を調整し、社会的安定と成長を両立させる体制です。"
 progressivism_left_wing_populism_ideology:0 "左翼ポピュリズム"
 progressivism_left_wing_populism_ideology_desc:0 "腐敗したエリート層や大資本に対抗し、一般大衆の声を代弁して大胆な富の再分配と反緊縮政策を掲げる思想です。"
 progressivism_left_wing_agrarianism_ideology:0 "左翼農本主義"
 progressivism_left_wing_agrarianism_ideology_desc:0 "農民の権利擁護と農地改革を最優先し、小規模農家の協同組合化と農村の生活水準向上を目指す思想です。"
 progressivism_popular_front_ideology:0 "人民戦線"
 progressivism_popular_front_ideology_desc:0 "ファシズムや権威主義の脅威に対抗するため、中道左派から社会主義者まで幅広い民主勢力が結集した連立路線です。"
 progressivism_social_radicalism_ideology:0 "社会急進主義"
 progressivism_social_radicalism_ideology_desc:0 "世俗主義、反教権主義、そして徹底した機会の平等を掲げ、旧来の社会階層や特権の打破を強く推進する思想です。"
 progressivism_christian_progressivism_ideology:0 "キリスト教進歩主義"
 progressivism_christian_progressivism_ideology_desc:0 "キリスト教の博愛と社会正義の教えに基づき、貧困の撲滅や人権擁護、平和主義を重視する進歩的路線です。"
 progressivism_west_coast_liberalism_ideology:0 "西海岸自由主義"
 progressivism_west_coast_liberalism_ideology_desc:0 "公民権運動や個人の自己実現、進歩的な社会実験を強く後押しする、アメリカ西海岸特有の革新的なリベラリズムです。"
 progressivism_east_coast_liberalism_ideology:0 "東海岸自由主義"
 progressivism_east_coast_liberalism_ideology_desc:0 "ニューディール政策の伝統を受け継ぎ、連邦政府の積極的な経済介入と国際協調主義を重視する知性派リベラリズムです。"
 progressivism_left_wing_kemalism_ideology:0 "左翼ケマル主義"
 progressivism_left_wing_kemalism_ideology_desc:0 "世俗主義や国家主義といった建国の理念を継承しつつ、反帝国主義と社会民主主義的な国家開発を推し進める思想です。"
 progressivism_left_wing_tridemism_ideology:0 "左翼三民主義"
 progressivism_left_wing_tridemism_ideology_desc:0 "孫文の三民主義における「民生主義」を重視し、地権の均等や資本の節制を通じて社会主義的な福祉国家を目指す思想です。"
 progressivism_militant_democracy_ideology:0 "戦闘的民主主義"
 progressivism_militant_democracy_ideology_desc:0 "民主主義の転覆を企む極左・極右の全体主義勢力に対しては、自由の制限や結社禁止などの断固たる措置で体制を防衛する思想です。"
 
# --- 自由主義 ---
 liberalism:0 "自由主義"
 liberalism_noun:0 "自由主義"
 liberalism_desc:0 "自由主義体制"

 liberalism_ideology:0 "自由主義"
 liberalism_ideology_desc:0 "中世の封建的社会への反発、より直接的には17世紀後半より始まった啓蒙主義の流れにより生まれた自由主義はジョン・ロックらにより体系化され、アメリカ独立宣言とフランス人権宣言、そしてナポレオン戦争により大いに発展した。今や自由主義は普遍的な価値観として世界に多大なる影響を与えている。\n自由主義の定義は幅広いため一概には言えないが、基本的に「自由主義」という思想は「自由権」と「寛容性」、そして「法の下の平等」という三つの柱により構成されている。ただその解釈は多様であり、大まかにはロックやミルに代表され政府による父権的な介入を非とする「消極的自由」とT・H・グリーンやレオナルド・ホブハウスに代表される自己実現の援助の為の国家の介入を是とする「積極的自由」に大別される。これらは前者が古典的自由主義、後者が社会自由主義の思想的根拠となり、双方は「自由主義」という枠組みでありながら相反する対立軸となっている。\n数世紀にわたる歴史の中で自由主義は専制や全体主義の魔の手により危機に瀕することも少なくなかったが、それにも関わらず自由の松明は煌々と輝いている。人間の意識に根差す根源的な自由への渇望は永遠に不滅であり、自由主義の灯火は未だ見ぬ未来に如何なる困難が待ち受けていようとも消えることはないだろう。"
 liberalism_classical_liberalism_ideology:0 "古典的自由主義"
 liberalism_classical_liberalism_ideology_desc:0 "個人の自由権と私有財産制を絶対視し、国家の役割を国防や治安維持などの最小限に留める「夜警国家」と自由放任経済を理想とする思想です。"
 liberalism_social_liberalism_ideology:0 "社会自由主義"
 liberalism_social_liberalism_ideology_desc:0 "個人の実質的な自由と自己実現を保障するため、教育・医療へのアクセスや適度な市場規制、社会福祉への国家介入を肯定する思想です。"
 liberalism_national_liberalism_ideology:0 "国家自由主義"
 liberalism_national_liberalism_ideology_desc:0 "立憲主義や自由貿易といった自由主義的価値観と、ナショナリズムおよび強い国民国家の建設を結びつけた思想です。"
 liberalism_neoliberalism_ideology:0 "新自由主義"
 liberalism_neoliberalism_ideology_desc:0 "規制緩和、国営企業の民営化、自由貿易の徹底を通じて市場の効率性を最大化し、経済成長を促す思想です。"
 liberalism_centrism_ideology:0 "中道主義"
 liberalism_centrism_ideology_desc:0 "左右の極端なイデオロギーを排し、現実的な妥協と合意形成、漸進的な政策運営によって社会の安定を保つ路線です。"
 liberalism_libertarianism_ideology:0 "リバタリアニズム"
 liberalism_libertarianism_ideology_desc:0 "個人の自己所有権と経済的自由を最優先し、徴税や政府によるあらゆる干渉を最小限まで削減することを求める急進的自由主義です。"
 liberalism_anarcho_capitalism_ideology:0 "アナルコ・キャピタリズム"
 liberalism_anarcho_capitalism_ideology_desc:0 "国家そのものを不要な暴力装置として廃止し、治安や司法を含むすべての社会サービスを自由市場と民間契約に委ねる思想です。"
 liberalism_market_liberalism_ideology:0 "市場自由主義"
 liberalism_market_liberalism_ideology_desc:0 "自由競争と私有財産の保護を経済繁栄の源泉とみなし、政府の市場介入を極力排除するビジネス重視の自由主義です。"
 liberalism_liberal_populism_ideology:0 "リベラル・ポピュリズム"
 liberalism_liberal_populism_ideology_desc:0 "既得権益層や官僚機構を批判し、減税や規制撤廃、直接民主制的な改革によって一般市民の自由と利益を取り戻そうとする思想です。"
 liberalism_liberal_agrarianism_ideology:0 "自由農本主義"
 liberalism_liberal_agrarianism_ideology_desc:0 "自作農の独立と財産権を民主主義の基盤とみなし、農村の自由と地方自治を重んじる思想です。"
 liberalism_liberal_radicalism_ideology:0 "自由急進主義"
 liberalism_liberal_radicalism_ideology_desc:0 "普通選挙の徹底、世俗主義、旧来の特権階級や王政の廃止を強く主張する、19世紀共和主義の伝統を引く急進的自由主義です。"
 liberalism_christian_liberalism_ideology:0 "キリスト教自由主義"
 liberalism_christian_liberalism_ideology_desc:0 "キリスト教の人間観・道徳観と、信教の自由や立憲民主主義、個人の尊厳を調和させる思想です。"
 liberalism_islamic_liberalism_ideology:0 "イスラム自由主義"
 liberalism_islamic_liberalism_ideology_desc:0 "イスラム教の精神的価値を尊重しつつ、世俗的な立憲主義、表現の自由、近代的な市民権の確立を目指す思想です。"
 liberalism_ordoliberalism_ideology:0 "オルド自由主義"
 liberalism_ordoliberalism_ideology_desc:0 "自由市場が独占やカルテルによって自壊するのを防ぐため、国家が厳格な法秩序と競争ルールを設定・監視すべきとするドイツ発祥の思想です。"
 liberalism_cooperativism_ideology:0 "協同主義"
 liberalism_cooperativism_ideology_desc:0 "個人の自由と私有を認めつつ、市民や生産者が自発的に組織する協同組合のネットワークによって調和のとれた経済を目指す思想です。"
 liberalism_corporatocracy_liberalism_ideology:0 "企業支配自由主義"
 liberalism_corporatocracy_liberalism_ideology_desc:0 "自由市場と規制緩和の名の下に巨大企業や財閥が政治と経済の実権を掌握し、国家運営そのものが企業利益に奉仕する体制です。"

 # --- 自由保守主義 ---
 liberal_conservatism:0 "自由保守主義"
 liberal_conservatism_noun:0 "自由保守主義"
 liberal_conservatism_desc:0 "自由保守主義体制"

 liberal_conservatism_ideology:0 "自由保守主義"
 liberal_conservatism_ideology_desc:0 "伝統的な社会秩序や法の支配を重んじつつ、自由市場経済と個人の市民的自由を擁護する穏健な中道右派思想です。"
 liberal_conservatism_progressive_conservatism_ideology:0 "進歩的保守主義"
 liberal_conservatism_progressive_conservatism_ideology_desc:0 "社会の急激な変革を避けつつも、社会の安定と一体性を保つために適度な福祉政策や社会改革を肯定する保守思想です。"
 liberal_conservatism_constitutional_liberalism_ideology:0 "立憲自由主義"
 liberal_conservatism_constitutional_liberalism_ideology_desc:0 "厳格な憲法秩序と三権分立、立憲君主制などの伝統的制度を基盤として個人の自由と財産権を守る思想です。"
 liberal_conservatism_christian_democracy_ideology:0 "キリスト教民主主義"
 liberal_conservatism_christian_democracy_ideology_desc:0 "キリスト教の伝統的道徳観や家族観を重んじながら、社会的市場経済と福祉政策によって労使の調和と民主主義を目指す思想です。"
 liberal_conservatism_big_tent_ideology:0 "包括政党"
 liberal_conservatism_big_tent_ideology_desc:0 "特定の階級や厳格な教義にこだわらず、経済成長と体制の安定を軸に中道右派から中道左派まで幅広い有権者を結集する現実主義路線です。"
 liberal_conservatism_liberal_technocracy_ideology:0 "リベラル・テクノクラシー"
 liberal_conservatism_liberal_technocracy_ideology_desc:0 "議会制民主主義の枠組みを維持しつつ、経済や行政の運営を高度な専門知識を持つ官僚や技術官僚の合理的判断に委ねる体制です。"
 liberal_conservatism_oligarchic_liberalism_ideology:0 "寡頭的自由主義"
 liberal_conservatism_oligarchic_liberalism_ideology_desc:0 "立憲主義や自由貿易の形式を保ちながらも、実質的な政治権力と経済資源が限られた名門家系や有力資産家層に集中している体制です。"
 liberal_conservatism_rockefeller_conservatism_ideology:0 "ロックフェラー保守主義"
 liberal_conservatism_rockefeller_conservatism_ideology_desc:0 "財政規律と自由企業体制を重視する一方で、公民権の擁護やインフラ・教育への公共投資、国際協調を積極的に支持するアメリカ型の穏健保守思想です。"

 # --- 保守主義 ---
 conservatism:0 "保守主義"
 conservatism_noun:0 "保守主義"
 conservatism_desc:0 "保守主義体制"

 conservatism_ideology:0 "保守主義"
 conservatism_ideology_desc:0 "歴史的に培われた伝統、法秩序、家族や地域共同体の価値を重んじ、急進的な社会変革を避けて漸進的な発展を志向する思想です。"
 conservatism_social_conservatism_ideology:0 "社会保守主義"
 conservatism_social_conservatism_ideology_desc:0 "伝統的な家族観、宗教的道徳、社会規範の維持を政治の最優先課題とし、世俗化や急進的な文化変容に抵抗する思想です。"
 conservatism_paternalistic_conservatism_ideology:0 "父権的保守主義"
 conservatism_paternalistic_conservatism_ideology_desc:0 "支配層や国家には弱者を保護する道徳的義務（ノブレス・オブリージュ）があるとし、社会の安定のために上からの福祉や介入を肯定する思想です。"
 conservatism_agrarianism_ideology:0 "農本主義"
 conservatism_agrarianism_ideology_desc:0 "都市の工業化や商業主義よりも農村の伝統的共同体と農業を国の根幹とみなし、地主や農民の利益と伝統文化を守る思想です。"
 conservatism_christian_conservatism_ideology:0 "キリスト教保守主義"
 conservatism_christian_conservatism_ideology_desc:0 "キリスト教の教義と伝統的な道徳律を政治や法の基盤に据え、世俗主義や無神論的イデオロギーから社会を防衛しようとする思想です。"
 conservatism_sharia_democracy_ideology:0 "シャリーア民主主義"
 conservatism_sharia_democracy_ideology_desc:0 "議会制民主主義の枠組みの中で、イスラム法（シャリーア）の精神と伝統的価値観を立法と統治の基本原則に反映させる思想です。"
 conservatism_populist_conservatism_ideology:0 "ポピュリスト保守主義"
 conservatism_populist_conservatism_ideology_desc:0 "リベラルなエリート層や国際主義に反発し、一般大衆の愛国心と伝統的価値観を代弁して自国第一の政策を掲げる保守思想です。"
 conservatism_constitutional_minponshugi_ideology:0 "憲政民本主義"
 conservatism_constitutional_minponshugi_ideology_desc:0 "君主制や伝統的国体と立憲議会政治を調和させ、主権の所在よりも「民の福利を政治の目的とする」ことを重視する東洋型の立憲保守思想です。"
 conservatism_liberal_corporatism_ideology:0 "リベラル・コーポラティズム"
 conservatism_liberal_corporatism_ideology_desc:0 "民主主義と自由市場を維持しつつ、政府・産業界・労働組合の協調的ネットワークによって労使紛争を防ぎ経済成長を図る体制です。"
 conservatism_oligarchic_conservatism_ideology:0 "寡頭的保守主義"
 conservatism_oligarchic_conservatism_ideology_desc:0 "立憲議会制の形式を保ちながら、実質的な統治権力を伝統的な名望家、大地主、大資本家などの保守的エリート層が握る体制です。"
 conservatism_free_market_conservatism_ideology:0 "自由市場保守主義"
 conservatism_free_market_conservatism_ideology_desc:0 "伝統的な社会道徳の維持と、小さな政府・減税・自由放任主義による資本主義の保護を両立させる保守思想です。"
 conservatism_fusionism_ideology:0 "融合主義"
 conservatism_fusionism_ideology_desc:0 "伝統主義的保守主義（道徳と秩序）とリバタリアニズム（自由市場と小さな政府）を反共産主義の旗の下に統合した、戦後アメリカ型の保守思想です。"
 conservatism_traditional_conservatism_ideology:0 "伝統的保守主義"
 conservatism_traditional_conservatism_ideology_desc:0 "エドマンド・バークの流れを汲み、抽象的な理性による社会設計を退け、歴史の試練に耐えた慣習、宗教、階級秩序を尊重する思想です。"
 conservatism_neoconservatism_ideology:0 "新保守主義"
 conservatism_neoconservatism_ideology_desc:0 "自由民主主義と自国の価値観を世界へ広めるため、強力な軍事力と積極的な対外介入・封じ込め政策を辞さないタカ派的保守思想です。"
 conservatism_tridemism_ideology:0 "三民主義"
 conservatism_tridemism_ideology_desc:0 "孫文が提唱した民族・民権・民生の三原則を掲げ、伝統文化の復興と反共・近代的国民国家の建設を目指す中華型の保守・ナショナリズム思想です。"
 conservatism_right_wing_kemalism_ideology:0 "右翼ケマル主義"
 conservatism_right_wing_kemalism_ideology_desc:0 "ケマル・アタテュルクの世俗主義・近代化路線を継承しつつ、反共産主義と強い民族主義、国家主導の資本主義開発を重視する路線です。"

 # --- 権威民主主義 ---
 authoritarian_democracy:0 "権威民主主義"
 authoritarian_democracy_noun:0 "権威民主主義"
 authoritarian_democracy_desc:0 "権威民主主義体制"

 authoritarian_democracy_ideology:0 "権威民主主義"
 authoritarian_democracy_ideology_desc:0 "形式上の議会制や選挙制度を維持しつつ、強力な行政府、与党、あるいは軍部の指導力によって政治的安定と秩序を優先する統治体制です。"
 authoritarian_democracy_anocracy_ideology:0 "アノクラシー"
 authoritarian_democracy_anocracy_ideology_desc:0 "民主的制度と専制的な権力行使が混在する不安定な混合政体であり、政府の統治能力や合法性が常に揺らいでいる状態です。"
 authoritarian_democracy_oligarchy_ideology:0 "寡頭制"
 authoritarian_democracy_oligarchy_ideology_desc:0 "選挙や議会の裏側で、一握りの財閥・軍閥・政治家一族などの支配的エリート層が国家の意思決定を事実上独占している体制です。"
 authoritarian_democracy_national_conservatism_ideology:0 "国民保守主義"
 authoritarian_democracy_national_conservatism_ideology_desc:0 "国家主権、民族的アイデンティティ、伝統的文化の防衛を最優先し、秩序維持のためには強い国家権力の行使も辞さない保守思想です。"
 authoritarian_democracy_social_nationalism_ideology:0 "社会民族主義"
 authoritarian_democracy_social_nationalism_ideology_desc:0 "民族共同体の連帯と国家の威信を重んじつつ、自国民に対する手厚い福祉政策や国家主導の経済保護を結びつける思想です。"
 authoritarian_democracy_right_wing_populism_ideology:0 "右翼ポピュリズム"
 authoritarian_democracy_right_wing_populism_ideology_desc:0 "腐敗した既成エリート層や外国勢力に対抗し、「真の国民」の利益と伝統を守るためにカリスマ的指導者への権力集中を訴える思想です。"
 authoritarian_democracy_paternalistic_developmentalism_ideology:0 "父権的開発主義"
 authoritarian_democracy_paternalistic_developmentalism_ideology_desc:0 "「パンと自由の交換」を掲げ、政治的自由を一定程度制限する代わりに、国家主導の急速な工業化と国民生活の向上を実現する開発独裁路線です。"
 authoritarian_democracy_hegemonic_party_system_ideology:0 "ヘゲモニー政党制"
 authoritarian_democracy_hegemonic_party_system_ideology_desc:0 "複数政党の存在自体は認められているものの、選挙制度や国家機構の掌握によって特定の支配政党が半永久的に政権を維持する体制です。"
 authoritarian_democracy_semi_constitutional_monarchy_ideology:0 "半立憲君主制"
 authoritarian_democracy_semi_constitutional_monarchy_ideology_desc:0 "憲法と議会が存在するものの、君主が内閣の任免権や軍の統帥権、拒否権などの強大な実権を保持し続ける立憲体制です。"
 authoritarian_democracy_left_wing_corporatism_ideology:0 "左翼コーポラティズム"
 authoritarian_democracy_left_wing_corporatism_ideology_desc:0 "国家の強力な指導と統制の下に労働組合や大衆組織を統合し、反帝国主義的な経済開発と富の再分配を進める体制です。"
 authoritarian_democracy_herrenvolk_democracy_ideology:0 "ヘレンフォルク民主主義"
 authoritarian_democracy_herrenvolk_democracy_ideology_desc:0 "支配的な民族・人種集団の内部では高度な議会制民主主義が機能している一方、その他の被支配集団からは参政権と市民権が徹底的に剥奪されている体制です。"
 authoritarian_democracy_national_democracy_ideology:0 "国民民主主義"
 authoritarian_democracy_national_democracy_ideology_desc:0 "国民国家の統合と民族的連帯を民主主義の前提条件とし、少数派や反体制派に対する同化政策や強い国家統制を伴うナショナリズム路線です。"
 authoritarian_democracy_realpolitik_ideology:0 "レアルポリティーク"
 authoritarian_democracy_realpolitik_ideology_desc:0 "イデオロギーや道徳的理想よりも冷徹な国益計算と勢力均衡を最優先し、体制維持のためならあらゆる現実的手段を講じる統治路線です。"
 authoritarian_democracy_solidarism_ideology:0 "連帯主義"
 authoritarian_democracy_solidarism_ideology_desc:0 "階級闘争や個人主義的競争を排し、国家の調停の下で各職能団体や社会階層が有機的に連帯・協力することで社会の調和を目指す思想です。"
 authoritarian_democracy_provisional_government_ideology:0 "臨時政府"
 authoritarian_democracy_provisional_government_ideology_desc:0 "戦争、革命、あるいは独立直後の非常事態において、正式な憲法体制が確立されるまでの間、暫定的に全権を掌握している行政機構です。"
 authoritarian_democracy_transitional_democracy_ideology:0 "過渡期民主主義"
 authoritarian_democracy_transitional_democracy_ideology_desc:0 "権威主義体制や植民地支配からの脱却途上にあり、民主的な選挙制度や市民社会が段階的に整備されつつある移行期の政治体制です。"
 authoritarian_democracy_military_administration_ideology:0 "軍事行政"
 authoritarian_democracy_military_administration_ideology_desc:0 "治安維持や復興、あるいは民政移管への準備を名目として、軍部が憲法秩序の枠内で行政機構を直接監督・運営している体制です。"
 authoritarian_democracy_poujadism_ideology:0 "プジャード主義"
 authoritarian_democracy_poujadism_ideology_desc:0 "重税、官僚主義、大資本による近代化に反発する中小自営業者や農民層の不満を背景に、反議会主義とナショナリズムを掲げるポピュリズム運動です。"
 authoritarian_democracy_dixiecrat_ideology:0 "ディキシークラット"
 authoritarian_democracy_dixiecrat_ideology_desc:0 "連邦政府の介入に反対する「州権」の擁護を掲げ、人種隔離政策と伝統的な白人優位の社会秩序の維持を死守しようとするアメリカ南部の保守路線です。"
 authoritarian_democracy_kemalism_ideology:0 "ケマル主義"
 authoritarian_democracy_kemalism_ideology_desc:0 "共和主義、民族主義、人民主義、国家資本主義、世俗主義、革新主義の「六本の矢」を掲げ、軍と官僚のエリートが国家の近代化と世俗秩序を主導する思想です。"
 authoritarian_democracy_right_wing_tridemism_ideology:0 "右翼三民主義"
 authoritarian_democracy_right_wing_tridemism_ideology_desc:0 "孫文の「訓政期」の理念を強調し、共産主義の脅威から国家を防衛するために一党指導体制の下で近代化と反共統制を進める路線です。"
 authoritarian_democracy_sovereign_democracy_ideology:0 "主権民主主義"
 authoritarian_democracy_sovereign_democracy_ideology_desc:0 "西側諸国による「民主化」の押し付けや内政干渉を拒絶し、自国の歴史と主権に根ざした独自の民主主義のあり方を国家が主導して定義・防衛する思想です。"
 authoritarian_democracy_paternalistic_corporatism_ideology:0 "父権的企業主義"
 authoritarian_democracy_paternalistic_corporatism_ideology_desc:0 "国家と巨大企業グループが緊密に連携し、終身雇用や企業内福祉によって労働者を抱え込みながら、官民一体で高度経済成長を推進する体制です。"

 # --- 専制主義 ---
 despotism:0 "専制主義"
 despotism_noun:0 "専制主義"
 despotism_desc:0 "専制主義体制"

 despotism_ideology:0 "専制主義"
 despotism_ideology_desc:0 "特定の君主、指導者、または支配集団に無制限の権力が集中し、議会や法の制約を受けずに国家が統治される独裁体制です。"
 despotism_absolute_monarchy_ideology:0 "絶対君主制"
 despotism_absolute_monarchy_ideology_desc:0 "王権神授説や伝統的世襲に基づき、君主が立法・行政・司法のすべてを統べる絶対的な主権を保持する体制です。"
 despotism_military_junta_ideology:0 "軍事政権"
 despotism_military_junta_ideology_desc:0 "クーデターや非常事態宣言によって軍部の最高指導者会議が文民政府を排除し、戒厳令と軍事力によって国を直接統治する体制です。"
 despotism_civilian_dictatorship_ideology:0 "文民独裁"
 despotism_civilian_dictatorship_ideology_desc:0 "軍人ではない政治家や官僚出身の指導者が、一党支配や秘密警察、行政機構の掌握を通じて権力を独占する独裁体制です。"
 despotism_theocracy_ideology:0 "神権制"
 despotism_theocracy_ideology_desc:0 "神の代理人たる聖職者や宗教指導者が国家の最高権力を握り、宗教教義と聖法を国家の最高法規として統治する体制です。"
 despotism_papacy_ideology:0 "教皇制"
 despotism_papacy_ideology_desc:0 "カトリック教会の最高指導者であるローマ教皇が、霊的権威のみならず世俗の国家主権をも兼ね備えて統治する独自の神権体制です。"
 despotism_warlordism_ideology:0 "軍閥政権"
 despotism_warlordism_ideology_desc:0 "中央政府の統治が崩壊した地域において、私兵化した武装勢力を率いる軍閥指導者が実効支配と徴税を行う割拠体制です。"
 despotism_colonial_government_ideology:0 "植民地政府"
 despotism_colonial_government_ideology_desc:0 "本国から派遣された総督や植民地官僚が、現地の資源搾取と治安維持を目的として先住民を直接支配する従属的統治機構です。"
 despotism_personalistic_dictatorship_ideology:0 "個人独裁"
 despotism_personalistic_dictatorship_ideology_desc:0 "特定のイデオロギーや制度よりも、カリスマ的指導者個人の絶対的権威、個人崇拝、そして側近への恩顧関係によって維持される独裁体制です。"
 despotism_managerial_state_ideology:0 "管理国家"
 despotism_managerial_state_ideology_desc:0 "高度な官僚機構と技術的・科学的計画によって社会の隅々まで合理的に管理・統制し、効率性と秩序を追求する非イデオロギー的専制体制です。"
 despotism_technocratic_corporatism_ideology:0 "テクノクラート・コーポラティズム"
 despotism_technocratic_corporatism_ideology_desc:0 "技術官僚、産業資本、国家機関が一体化し、専門家の合理的な計画の下で産業と労働を厳格に組織化する開発専制体制です。"
 despotism_nominal_anarchism_ideology:0 "有名無実アナーキズム"
 despotism_nominal_anarchism_ideology_desc:0 "表向きは「国家の廃止と自由な自治」を掲げているものの、実際には武装集団の指導者や地域ボスが恣意的な暴力と私的権力で支配している無秩序体制です。"
 despotism_developmental_dictatorship_ideology:0 "開発独裁"
 despotism_developmental_dictatorship_ideology_desc:0 "民主主義や人権を完全に停止し、強権的な一党・個人支配の下で外資導入と重工業化を強行して国家の近代化を推し進める体制です。"
 despotism_interim_regime_ideology:0 "暫定政権"
 despotism_interim_regime_ideology_desc:0 "内戦やクーデター後の混乱を収拾するため、憲法を停止して全権を掌握している暫定的な統治機構であり、その実態は権威主義的な独裁に近い体制です。"
 despotism_partisan_movement_ideology:0 "パルチザン運動"
 despotism_partisan_movement_ideology_desc:0 "占領軍や圧政に対する武装抵抗組織がそのまま統治機構へと転化した体制であり、戦時規律とゲリラ戦の論理で地域を支配しています。"
 despotism_aristocratic_conservatism_ideology:0 "貴族的保守主義"
 despotism_aristocratic_conservatism_ideology_desc:0 "血統と世襲の特権を持つ貴族階級や大地主層が国家の要職と富を独占し、大衆民主主義を拒絶して旧来の身分秩序を守る体制です。"
 despotism_sham_constitutionalism_ideology:0 "外見的立憲主義"
 despotism_sham_constitutionalism_ideology_desc:0 "近代国家としての体裁を整えるために憲法や議会を設けているものの、実際には君主や独裁者がすべての権力を握り議会を形骸化させている体制です。"
 despotism_corporatocracy_ideology:0 "企業支配体制"
 despotism_corporatocracy_ideology_desc:0 "巨大な多国籍企業や植民地特許会社が国家の主権そのものを掌握し、利益の最大化と資源開発のために領土と住民を直接統治する体制です。"
 despotism_mafia_state_ideology:0 "マフィア国家"
 despotism_mafia_state_ideology_desc:0 "政府高官、治安機関、組織犯罪シンジケートが完全に癒着し、密輸、汚職、恐喝によって国家の富が支配ファミリーに吸い上げられる腐敗体制です。"
 despotism_military_oligarchy_ideology:0 "軍事寡頭制"
 despotism_military_oligarchy_ideology_desc:0 "特定の独裁者一人ではなく、陸海空軍のトップや有力な軍司令官たちの合議・勢力均衡によって国家が支配される寡頭制の軍事政権です。"
 despotism_oligarchic_legalism_ideology:0 "寡頭的法治主義"
 despotism_oligarchic_legalism_ideology_desc:0 "支配エリート層が自らの特権と権力を正当化するために厳格な法律と司法手続きを駆使し、合法的な装いの下で反体制派を弾圧する体制です。"
 despotism_national_catholicism_ideology:0 "国家カトリック主義"
 despotism_national_catholicism_ideology_desc:0 "カトリック教会と権威主義的国家が密接に結びつき、伝統的な宗教道徳、反共主義、権威への服従を国民統合の柱とする体制です。"
 despotism_eurasianism_ideology:0 "ユーラシア主義"
 despotism_eurasianism_ideology_desc:0 "西洋の個人主義や自由主義を退け、ユーラシア大陸独自の伝統と地政学的運命に基づき、強力な中央集権国家による大陸帝国的秩序を目指す思想です。"
 despotism_chiang_kai_shek_thought_ideology:0 "蒋介石思想"
 despotism_chiang_kai_shek_thought_ideology_desc:0 "儒教的伝統道徳（新生活運動）と反共ナショナリズム、そして総統への絶対的忠誠を結びつけ、軍事的・党治的独裁によって大陸反攻と国家再建を目指す思想です。"
 despotism_radical_kemalism_ideology:0 "急進ケマル主義"
 despotism_radical_kemalism_ideology_desc:0 "国家の世俗化と近代化を徹底するため、議会制や伝統的宗教勢力を力ずくで抑え込み、エリートによる上からの急進的な社会改造を断行する権威主義路線です。"
 despotism_neo_baathism_ideology:0 "新バアス主義"
 despotism_neo_baathism_ideology_desc:0 "アラブ民族主義と世俗的な国家社会主義を掲げつつ、軍部と秘密警察による厳格な一党独裁と個人崇拝によって国家を統制する急進的権威主義体制です。"

 # --- ファシズム ---
 fascism:0 "ファシズム"
 fascism_noun:0 "ファシズム"
 fascism_desc:0 "ファシズム体制"

 fascism_ideology:0 "ファシズム"
 fascism_ideology_desc:0 "自由民主主義とマルクス主義の双方を否定し、カリスマ的指導者の下での全体主義的国家統合と民族の再生を掲げる急進的権威主義思想です。"
 fascism_state_corporatism_ideology:0 "国家コーポラティズム"
 fascism_state_corporatism_ideology_desc:0 "階級闘争を禁じ、国家の厳格な監督の下で産業別の労使協調組合（コルポラツィオーネ）に経済と社会を統合する体制です。"
 fascism_revolutionary_nationalism_ideology:0 "革命的民族主義"
 fascism_revolutionary_nationalism_ideology_desc:0 "旧来の保守的エリートや腐敗した既成秩序を暴力的に打破し、民族全体の覚醒と根源的な社会刷新を目指す急進的ナショナリズムです。"
 fascism_state_directed_corporatocracy_ideology:0 "国家統制企業支配"
 fascism_state_directed_corporatocracy_ideology_desc:0 "国家の軍事・戦略目標を達成するため、巨大財閥や国策企業が国家機関と一体化し、半官半民の独占体制で経済と国民を支配する体制です。"
 fascism_fascist_populism_ideology:0 "ファシスト・ポピュリズム"
 fascism_fascist_populism_ideology_desc:0 "大衆の熱狂と反エリート感情を動員し、福祉政策や反大資本スローガンを掲げながら一党独裁と指導者崇拝を正当化する大衆迎合的ファシズムです。"
 fascism_clerical_fascism_ideology:0 "教権的ファシズム"
 fascism_clerical_fascism_ideology_desc:0 "ファシズムの全体主義的な国家統制・反共主義と、伝統的な宗教教義や聖職者の権威を結合させた宗教的全体主義思想です。"
 fascism_national_syndicalism_ideology:0 "国家サンディカリスム"
 fascism_national_syndicalism_ideology_desc:0 "労働組合による直接行動と生産者主権の理念を民族主義と融合させ、国家の枠内で産業組合による計画経済を目指す思想です。"
 fascism_proletarian_nationalism_ideology:0 "プロレタリア民族主義"
 fascism_proletarian_nationalism_ideology_desc:0 "国際社会を「持てる富豪国家」と「持たざる無産国家」の階級闘争と捉え、抑圧された民族の解放と生存圏の獲得を正当化する思想です。"
 fascism_falangism_ideology:0 "ファランヘ主義"
 fascism_falangism_ideology_desc:0 "伝統的な宗教精神、民族の統一、そして国家サンディカリスム的な社会改革を融合させ、指導者への規律ある服従を重んじるスペイン発祥の思想です。"
 fascism_fascist_mysticism_ideology:0 "ファシスト神秘主義"
 fascism_fascist_mysticism_ideology_desc:0 "合理主義や物質主義を退け、民族の神話的過去、英雄的自己犠牲、非合理的な意志と直観の力を国家統合の核に据える思想です。"
 fascism_sansepolcrismo_ideology:0 "サンセポルクロ主義"
 fascism_sansepolcrismo_ideology_desc:0 "初期ファシズムの原点に立ち返り、反君主制・反教権主義・急進的な労働者保護と激しいナショナリズムを併せ持つ左派的ファシズムです。"
 fascism_neofascism_ideology:0 "ネオファシズム"
 fascism_neofascism_ideology_desc:0 "第二次世界大戦後の新たな国際環境に適応し、伝統的なファシズムの理念を現代的なナショナリズムや反共・反自由主義運動として再構築した思想です。"
 fascism_integralism_ideology:0 "統合主義"
 fascism_integralism_ideology_desc:0 "個人主義や自由主義によって分断された社会を否定し、伝統的宗教、家族、職能団体、そして強力な国家の有機的な一体化を目指す思想です。"
 fascism_neosocialism_ideology:0 "新社会主義"
 fascism_neosocialism_ideology_desc:0 "マルクス主義の階級闘争論を捨て、「秩序・権威・国民」を掲げて強力な国家統制と計画経済による中産階級・労働者の統合を目指す権威主義的社会主義です。"
 fascism_conservative_revolution_ideology:0 "革命的保守主義"
 fascism_conservative_revolution_ideology_desc:0 "単なる復古ではなく、近代技術と戦時動員の力を駆使して自由主義文明を破壊し、英雄的・階層的な新秩序を創造しようとする思想です。"
 fascism_revolutionary_zionism_ideology:0 "革命的シオニズム"
 fascism_revolutionary_zionism_ideology_desc:0 "社会主義的な妥協を排し、圧倒的な軍事力と民族的団結、徹底した国家主権の確立によって歴史的領土の完全回復を目指す強硬な民族主義です。"
 fascism_reform_bureaucracy_ideology:0 "革新官僚支配"
 fascism_reform_bureaucracy_ideology_desc:0 "議会政治と自由放任資本主義を非効率と断じ、国防国家の建設と総力戦体制の確立のためにエリート官僚群が計画経済と国民生活を直接統制する体制です。"

 # --- 国家社会主義 ---
 national_socialism:0 "国家社会主義"
 national_socialism_noun:0 "国家社会主義"
 national_socialism_desc:0 "国家社会主義体制"

 national_socialism_ideology:0 "国家社会主義"
 national_socialism_ideology_desc:0 "人種的優越主義、生存圏の拡大、反ユダヤ・反共産主義、 tender 総統原理による絶対的独裁を柱とする極右全体主義思想です。"
 national_socialism_esoteric_national_socialism_ideology:0 "異端的国家社会主義"
 national_socialism_esoteric_national_socialism_ideology_desc:0 "オカルト主義や神秘主義的な人種神話と国家社会主義を融合させ、形而上学的な純粋性と終末論的新秩序を追求するカルト的全体主義です。"
 national_socialism_revolutionary_national_socialism_ideology:0 "革命的国家社会主義"
 national_socialism_revolutionary_national_socialism_ideology_desc:0 "大資本や旧来の保守的エリートとの妥協を許さず、反資本主義的な社会革命と民族共同体の徹底的平等を掲げる急進左派적ナチズムです。"
 national_socialism_ultradoctrinaire_nazism_ideology:0 "超教義的ナチズム"
 national_socialism_ultradoctrinaire_nazism_ideology_desc:0 "時代や状況の変化に応じた一切の現実的妥協を拒絶し、初期の教義と人種政策を文字通り一字一句狂信的に実行し続ける教条主義体制です。"
 national_socialism_indigenized_national_socialism_ideology:0 "土着化国家社会主義"
 national_socialism_indigenized_national_socialism_ideology_desc:0 "ヨーロッパ発祥の国家社会主義の統治手法や民族純化論を、非欧州地域の土着の文化・歴史・民族ナショナリズムへと適応させた思想です。"
 national_socialism_technocratic_nazism_ideology:0 "テクノクラート・ナチズム"
 national_socialism_technocratic_nazism_ideology_desc:0 "党のイデオロギー的熱狂よりも、科学技術・巨大インフラ計画・官僚的合理性を駆使して帝国と人種支配システムを効率的に運営する体制です。"
 national_socialism_stratocratic_nazism_ideology:0 "軍政ナチズム"
 national_socialism_stratocratic_nazism_ideology_desc:0 "党組織に代わって国防軍や親衛隊の軍司令官たちが国家の全権を掌握し、永久戦争と占領地統治のために国全体を軍営化した体制です。"
 national_socialism_agrarian_nazism_ideology:0 "農耕ナチズム"
 national_socialism_agrarian_nazism_ideology_desc:0 "「血と土」の理念を極限まで推し進め、退廃した都市文明や近代工業を解体して、純血の農民戦士による自給自足の農村帝国を築こうとする思想です。"
 national_socialism_securocratic_nazism_ideology:0 "防諜ナチズム"
 national_socialism_securocratic_nazism_ideology_desc:0 "秘密警察と巨大情報機関が党と国家そのものを乗っ取り、全人口への徹底的な監視・粛清・情報操作によって支配を維持する警察国家体制です。"
 national_socialism_spartan_nazism_ideology:0 "スパルタ的ナチズム"
 national_socialism_spartan_nazism_ideology_desc:0 "あらゆる贅沢、消費文化、人間的感情を堕落として排斥し、禁欲的な規律、強制労働、絶対服従によって純粋な戦士階級のみを育成する極限の全体主義です。"
 national_socialism_palingenetic_nazism_ideology:0 "パリンジェネティック・ナチズム"
 national_socialism_palingenetic_nazism_ideology_desc:0 "腐敗した現代文明の徹底的な破壊と浄化の炎を通じてのみ、民族の奇跡的な「再生（パリンジェネシス）」が達成されると説く黙示録的ナチズムです。"
 national_socialism_national_bolshevism_ideology:0 "国家ボリシェヴィズム"
 national_socialism_national_bolshevism_ideology_desc:0 "マルクス・レーニン主義的な計画経済や反西欧主義と、極端な民族主義・国家社会主義の全体主義的統制を融合させた過激な混合思想です。"

 # --- 超国粋主義 ---
 ultranationalism:0 "超国粋主義"
 ultranationalism_noun:0 "超国粋主義"
 ultranationalism_desc:0 "超国粋主義体制"

 ultranationalism_ideology:0 "超国粋主義"
 ultranationalism_ideology_desc:0 "自民族の絶対的優越と排他的な国家主義を極限まで推し進め、外交的妥協を拒絶して全土の総力戦体制と純化を強行する過激思想です。"
 ultranationalism_ultramilitarism_ideology:0 "超軍国主義"
 ultranationalism_ultramilitarism_ideology_desc:0 "国家の存在意義そのものを戦争と征服に置き、市民生活のすべてを軍隊の規律と軍需生産に従属させる極限の兵営国家体制です。"
 ultranationalism_stratocratic_corporatism_ideology:0 "軍政コーポラティズム"
 ultranationalism_stratocratic_corporatism_ideology_desc:0 "軍部の最高司令部が産業界と労働組織を完全に掌握し、総力戦の遂行のみを目的として全経済を軍事工場へと再編する体制です。"
 ultranationalism_fundamentalism_ideology:0 "原理主義"
 ultranationalism_fundamentalism_ideology_desc:0 "近代化や世俗主義を悪魔的堕落として徹底的に排撃し、聖典の字義通りの解釈と厳格な宗教律法によって国家と社会を浄化する過激神権思想です。"
 ultranationalism_reactionary_nationalism_ideology:0 "反動的国粋主義"
 ultranationalism_reactionary_nationalism_ideology_desc:0 "近代の啓蒙主義や民主主義の歴史をすべて否定し、暴力的な粛清によって失われた古来の身分秩序と伝統的国体を強引に復活させる思想です。"
 ultranationalism_securocratic_state_ideology:0 "防諜国家"
 ultranationalism_securocratic_state_ideology_desc:0 "国家そのものが巨大な情報機関と秘密警察の集合体と化し、国民全員を相互監視と恐怖で縛り上げて外部からのあらゆる影響を遮断する体制です。"
 ultranationalism_neo_isolationism_ideology:0 "新鎖国体制"
 ultranationalism_neo_isolationism_ideology_desc:0 "腐敗した外の世界からの汚染を防ぐため、国境を完全に封鎖して貿易や外交を断絶し、徹底した自給自足と孤立主義を貫く閉鎖体制です。"
 ultranationalism_national_revanchism_ideology:0 "国家復讐主義"
 ultranationalism_national_revanchism_ideology_desc:0 "過去の敗戦と領土喪失の屈辱を晴らすことだけを国家の唯一の目標に掲げ、敵国への報復戦争と失地回復にすべての国力を注ぎ込む狂信的思想です。"
 ultranationalism_neopaganism_ideology:0 "新異教主義"
 ultranationalism_neopaganism_ideology_desc:0 "キリスト教などの普遍宗教を「民族の精神を弱体化させた外来思想」として排斥し、古代の土着信仰や戦士の神話を復興させて民族の闘争本能を呼び覚ます思想です。"
 ultranationalism_paleo_revivalism_ideology:0 "古代回帰主義"
 ultranationalism_paleo_revivalism_ideology_desc:0 "現代の文明や技術を堕落の産物として破壊し、神話時代や古代帝国の生活様式・社会構造へと社会全体を強制的に逆行させる極端な復古思想です。"
